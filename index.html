<style>
:root{
  --paper:#EFF2E9; --card:#fff; --ink:#1E2A1C; --muted:#6E7A66; --line:#DEE4D6; --line2:#EFF2E9;
  --brand:#3B5936; --brand-dk:#2F4A2B; --brand-lt:#83B145;
  --pro:#3B4FB0; --carb:#B87A14; --fat:#17857C; --ok:#4A7A2C;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Quicksand","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pro);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
img{max-width:100%;display:block}

.top{position:sticky;top:0;z-index:20;background:rgba(239,242,233,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand img{height:28px;display:block}
.spacer{flex:1}
.langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.langtoggle button{background:none;border:0;padding:5px 10px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.langtoggle button.on{background:var(--brand);color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 16px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.solid:hover{background:var(--brand-dk)}
.btn.lg{padding:12px 24px;font-size:15px}
.btn.install{background:#E3ECD9;color:var(--brand-dk);border-color:var(--brand-lt)}
.btn.install:hover{background:#D7E4C9;border-color:var(--brand-dk)}
.btn.install::before{content:"⤓";font-size:14px;line-height:1}

.hero{padding-block:80px 56px;text-align:center}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-dk);background:#E3ECD9;padding:5px 12px;border-radius:99px}
.herotop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.herotop .btn.install{padding:5px 12px;font-size:12px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.08;margin:0 0 18px;letter-spacing:-.02em}
.sub{font-size:17px;color:var(--muted);max-width:600px;margin:0 auto 30px;line-height:1.6}
.herobtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}

section{padding-block:88px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(22px,3vw,32px);margin:0 0 14px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:15.5px;max-width:560px;margin:0 0 42px;line-height:1.6}
.center{text-align:center;margin-left:auto;margin-right:auto}

.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.ficon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px}
.ficon.p{background:#E9EBFA;color:var(--pro)} .ficon.c{background:#F7EEDC;color:var(--carb)}
.ficon.f{background:#E1F1EE;color:var(--fat)} .ficon.b{background:#E3ECD9;color:var(--brand)}
.fcard h3{font-family:var(--disp);font-weight:600;font-size:16.5px;margin:0 0 6px}
.fcard p{color:var(--muted);font-size:13.8px;line-height:1.55;margin:0}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px}
.step{position:relative}
.step:not(:last-child){border-inline-end:1px dashed var(--line)}
.stepnum{font-family:var(--disp);font-weight:700;font-size:34px;color:var(--brand-lt);margin-bottom:10px}
.step h3{font-family:var(--disp);font-weight:600;font-size:16px;margin:0 0 6px}
.step p{color:var(--muted);font-size:13.8px;line-height:1.55;margin:0}

.demo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;max-width:820px;margin:0 auto}
.demogrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.dfield{margin-bottom:13px}
.dfield label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.dfield input,.dfield select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--paper);font-size:14px}
.dfield input:focus,.dfield select:focus{border-color:var(--pro);background:var(--card)}
.dseg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dseg button{flex:1;background:var(--paper);border:0;padding:9px 6px;font-size:12.5px;color:var(--muted)}
.dseg button.on{background:var(--brand);color:#fff;font-weight:600}
.dresult{background:var(--paper);border-radius:14px;padding:20px}
.dresult .kcal{font-family:var(--disp);font-weight:700;font-size:40px;color:var(--brand-dk);line-height:1}
.dresult .kcalsub{color:var(--muted);font-size:13px;margin:4px 0 18px}
.macrorow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.macrorow:first-of-type{border-top:0}
.mlab{display:flex;align-items:center;gap:8px;font-size:13.5px}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.dot.p{background:var(--pro)} .dot.c{background:var(--carb)} .dot.f{background:var(--fat)}
.mval{font-family:var(--mono);font-size:13.5px}
.demonote{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.demoCTA{margin-top:18px;text-align:center}

.finalcta{background:var(--brand);border-radius:20px;padding:64px 32px;text-align:center;color:#fff;max-width:920px;margin:0 auto}
.finalcta h2{color:#fff}
.finalcta p{color:#D9E4CE;max-width:480px;margin:0 auto 26px}
.finalcta .btn.solid{background:#fff;color:var(--brand-dk);border-color:#fff}
.finalcta .btn.solid:hover{background:#EFF2E9}

footer{padding-block:44px 56px;color:var(--muted);font-size:12.5px;text-align:center}

@media (max-width:820px){
  section{padding-block:56px}
  .hero{padding-block:52px 36px}
  .fgrid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:24px}
  .step:not(:last-child){border-inline-end:0;border-bottom:1px dashed var(--line);padding-bottom:20px}
  .demogrid{grid-template-columns:1fr}
  .finalcta{padding:44px 24px}
}
@media (max-width:520px){
  .herobtns .btn{width:100%;justify-content:center}
}
</style>

<div class="top">
  <div class="topin">
    <div class="brand"><img src="logo-lockup.png" alt="Food's Up"></div>
    <span class="spacer"></span>
    <div class="langtoggle" id="langToggle">
      <button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="ar">عربي</button>
    </div>
    <a class="btn" id="navSignin" href="app.html?start=1" data-t="navSignin">Sign in</a>
  </div>
</div>

<main>

      <a class="btn solid lg" id="ctaStart" href="app.html?start=1" data-t="ctaStart">Get started free</a>

    </div>
  </section>

  <section class="wrap">
    <div class="fgrid">

      <div class="fcard"><div class="ficon p">🍳</div><h3 data-t="f2h"></h3><p data-t="f2p"></p></div>
      <div class="fcard"><div class="ficon c">👨‍👩‍👧</div><h3 data-t="f3h"></h3><p data-t="f3p"></p></div>

    </div>
  </section>

  <section class="wrap">
    <p class="kicker center" data-t="howkick"></p>
    <h2 class="center" data-t="howh"></h2>
    <p class="lead center" data-t="howp"></p>
    <div class="steps">
      <div class="step"><div class="stepnum">1</div><h3 data-t="s1h"></h3><p data-t="s1p"></p></div>
      <div class="step"><div class="stepnum">2</div><h3 data-t="s2h"></h3><p data-t="s2p"></p></div>
      <div class="step"><div class="stepnum">3</div><h3 data-t="s3h"></h3><p data-t="s3p"></p></div>
    </div>
  </section>

  <section class="wrap" id="demo">
    <p class="kicker center" data-t="demokick"></p>
    <h2 class="center" data-t="demoh"></h2>
    <p class="lead center" data-t="demop"></p>
    <div class="demo">
      <div class="demogrid">
        <div>
          <div class="dfield"><label data-t="dl_sex"></label>
            <div class="dseg" data-w="sex"><button data-v="male" class="on" data-t="dv_male"></button><button data-v="female" data-t="dv_female"></button></div></div>
          <div class="dfield"><label data-t="dl_age"></label><input type="number" id="dAge" value="30" min="14" max="90"></div>
          <div class="dfield"><label data-t="dl_height"></label><input type="number" id="dHeight" value="172" min="120" max="220"></div>
          <div class="dfield"><label data-t="dl_weight"></label><input type="number" id="dWeight" value="76" min="35" max="220"></div>
          <div class="dfield"><label data-t="dl_activity"></label>
            <select id="dActivity">
              <option value="1.2" data-t="dv_sedentary"></option>
              <option value="1.375" selected data-t="dv_light"></option>
              <option value="1.55" data-t="dv_active"></option>
              <option value="1.725" data-t="dv_veryactive"></option>
            </select></div>
          <div class="dfield"><label data-t="dl_goal"></label>
            <div class="dseg" data-w="goal">
              <button data-v="-1" data-t="dv_lose"></button>
              <button data-v="0" class="on" data-t="dv_maintain"></button>
              <button data-v="1" data-t="dv_gain"></button>
            </div></div>
        </div>
        <div class="dresult">
          <div class="kcal num" id="dKcal">2,011</div>
          <div class="kcalsub" data-t="dr_perday"></div>
          <div class="macrorow"><span class="mlab"><span class="dot p"></span><span data-t="dr_protein"></span></span><span class="mval num" id="dP">198 g</span></div>
          <div class="macrorow"><span class="mlab"><span class="dot c"></span><span data-t="dr_carbs"></span></span><span class="mval num" id="dC">177 g</span></div>
          <div class="macrorow"><span class="mlab"><span class="dot f"></span><span data-t="dr_fat"></span></span><span class="mval num" id="dF">57 g</span></div>
        </div>
      </div>
      <p class="demonote" data-t="demonote"></p>
      <div class="demoCTA"><a class="btn solid" id="ctaDemo" href="app.html?start=1" data-t="demoCTA"></a></div>
    </div>
  </section>

  <section class="wrap">
    <div class="finalcta">
      <h2 data-t="finalh"></h2>
      <p data-t="finalp"></p>
      <a class="btn solid lg" href="app.html?start=1" data-t="ctaStart">Get started free</a>
    </div>
  </section>
</main>

<footer class="wrap">
  <span data-t="footer"></span>
</footer>

let LANG = (()=>{ try{ return localStorage.getItem('minumeal:lang')||'en'; }catch(e){ return 'en'; } })();

function applyLang(){
  const dict = T[LANG] || T.en;
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.dataset.t;
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on', b.dataset.l===LANG));
  runDemo();
}
document.getElementById('langToggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  LANG = b.dataset.l;
  try{ localStorage.setItem('minumeal:lang', LANG); }catch(e){}
  applyLang();
});

/* ---- mini demo calculator (same formulas as the app's onboarding — see app.js calcTargets) ---- */
const $ = s => document.querySelector(s);
document.querySelectorAll('[data-w] button').forEach(b=>{
  b.addEventListener('click', ()=>{
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    runDemo();
  });
});
['dAge','dHeight','dWeight','dActivity'].forEach(id=>$('#'+id).addEventListener('input', runDemo));
$('#dActivity').addEventListener('change', runDemo);

function runDemo(){
  const sex = document.querySelector('[data-w="sex"] .on')?.dataset.v || 'male';
  const goal = +(document.querySelector('[data-w="goal"] .on')?.dataset.v || 0);
  const age = +$('#dAge').value || 30, h = +$('#dHeight').value || 170, w = +$('#dWeight').value || 70;
  const act = +$('#dActivity').value || 1.375;
  const bmr = sex==='female' ? (10*w+6.25*h-5*age-161) : (10*w+6.25*h-5*age+5);
  const tdee = bmr*act;
  const kcal = Math.round(goal<0 ? tdee*0.85 : goal>0 ? tdee*1.15 : tdee);
  const protein = w * (goal<0 ? 2.2 : 1.8);
  const fat = w * 0.8;
  const carbs = Math.max(0, (kcal - protein*4 - fat*9)/4);
  const fmt = n => n.toLocaleString('en-US');
  $('#dKcal').textContent = fmt(kcal);
  $('#dP').textContent = fmt(Math.round(protein))+' g';
  $('#dC').textContent = fmt(Math.round(carbs))+' g';
  $('#dF').textContent = fmt(Math.round(fat))+' g';
}

/* ---- install button (Chromium: real prompt; iOS: instructions, no JS-triggerable install exists) ---- */
(function(){
  const btn = document.getElementById('installBtn');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return; // already installed — nothing to offer

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferredPrompt = null;

  if (isIOS) {
    // keep the button label short ("Install app") on every screen size — the long
    // instruction only shows in the tap-triggered alert, never crammed into the button itself
    btn.style.display = '';
    btn.addEventListener('click', () => alert((T[LANG]||T.en).installIOS));
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = '';
    });
    btn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      btn.style.display = 'none';
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });
    window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
  }
})();

applyLang();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
